services:
  - type: web
    name: github-stats-contrib
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://stellar5055.github.io
      - key: GITHUB_TOKEN
        sync: false
